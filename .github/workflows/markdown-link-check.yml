name: Markdown Link Check

on:
  pull_request:
    paths:
      - '**/*.md'
      - '.lycheeignore'
      - '.github/workflows/markdown-link-check.yml'

  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - '.lycheeignore'
      - '.github/workflows/markdown-link-check.yml'

  schedule:
    - cron: '0 6 * * 1'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    name: Check Links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            "**/*.md"
          fail: true
